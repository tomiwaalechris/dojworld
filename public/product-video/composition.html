<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coastline PMS — Motion composition</title>
<style>@font-face{font-family:Geist;src:url('./geist.woff2')}*{box-sizing:border-box}body{margin:0;background:#091c18;color:#edf5e9;font:15px Geist,system-ui,sans-serif}canvas{display:block;width:100%;max-height:calc(100vh - 90px);object-fit:contain}nav{max-width:1100px;margin:20px auto;display:flex;align-items:center;gap:18px;padding:0 20px}button{background:#e3f18e;border:0;border-radius:8px;padding:10px 18px;font:inherit;color:#133d35;cursor:pointer}input{flex:1;accent-color:#e3f18e}a{color:#e3f18e}body.render canvas{width:1920px;height:1080px;max-height:none}body.render nav{display:none}</style></head>
<body><canvas id="film" width="1920" height="1080" aria-label="Animated walkthrough of Coastline PMS. Illustrative sample data."></canvas><nav><button id="play">Play</button><label for="scrub">Time</label><input id="scrub" type="range" min="0" max="72" step="0.1" value="3.5"><output id="time">0:03 / 1:12</output><a href="./index.html">Finished video</a></nav><script src="./film.js"></script></body></html>
